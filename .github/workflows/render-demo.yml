name: Render Demo

# Renders one queued demo segment to mp4 and stages it in R2 for review.
#
# Dispatched by Soracle's requestRender action, never by hand and never on
# push: a run costs several minutes of compute and writes to the queue row it
# was given. workflow_dispatch only.
#
# Every exit path reports back. A job that dies without calling back leaves its
# row at 'rendering' forever, which looks identical to a job that is still
# working -- so the failure step below is not optional politeness, it is the
# only thing that makes a dead job visible.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "youtube_render_queue row id"
        required: true
      demo_key:
        description: "R2 object key of the .dm_15"
        required: true
      start_ms:
        required: true
      end_ms:
        required: true
      fps:
        default: "60"
      width:
        default: "1920"
      height:
        default: "1080"
      fov:
        description: "Match the web viewer's FIXED_FOV so renders look like the site"
        default: "120"
      cam_mode:
        default: "follow"
      follow_client_id:
        default: ""

env:
  # Which build of the engine to render with. An env var rather than a literal
  # because the render config and the engine move together -- seekdemo below
  # only exists in the fork -- and this is how a change to one gets tested
  # against the other before either lands.
  ENGINE_REF: "master"
  ASSET_VERSION: "20260805"
  # Community pk3s staged alongside the trimmed base assets.
  #
  # Two different jobs, worth keeping straight. The model packs are an accuracy
  # fix: a demo records each player's model as a configstring, and when the
  # model is missing the engine quietly substitutes a default -- so those demos
  # have been rendering as the wrong character. The rest override base content
  # (sky, saber blades, saber sounds, flags and HUD) and do the opposite: they
  # make a render look like something other than what the players saw. That is
  # a house style, chosen deliberately, not a fix.
  #
  # The engine loads pk3s in name order and later wins, so these names ARE the
  # precedence, and anything here beats assets*.pk3. Renamed on upload for that
  # reason. Kept out of base-min.tar so a change here cannot damage a
  # known-good 127MB artifact -- and so this list reads as the changelog.
  #
  # z_basemin_chrome2.pk3 is the odd one out: not community content but a
  # repair. base-min is trimmed and dropped gfx/effects/chrome2.jpg, which the
  # bones shader maps additively over the whole model, so a missing texture
  # resolved to the default white one and the model came out a grey blob. Nine
  # kilobytes, restored. Anything else that pack reaches for and base-min lacks
  # will look the same way, so this is the place to put the next one.
  EXTRAS_VERSION: "20260806"
  EXTRA_PK3S: >-
    z_basemin_chrome2.pk3
    solar_yavinsky2.pk3
    eoi_imperialworker_v2_sounds.pk3
    x_kestis_sounds.pk3
    z_flag-console-field-scoreboard.pk3
    z_nightmares.pk3
    zzz_bones.pk3
    zzzTricolor_Sabers_by_Apple.pk3
  R2_PUBLIC: "https://pub-76bff0ef02794a5d95b7e2a8b8660f61.r2.dev"
  SORACLE_URL: "https://jk2ctf.vercel.app"
  RENDER_BUCKET: "jk2renders"
  # Brightness, applied to the finished video as a gamma curve.
  #
  # Renders come out dark and the engine has no working lever for it. Gamma
  # there is inert: postprocessing gamma needs ARB programs llvmpipe lacks, so
  # it falls back to hardware gamma, which (a) forces overbrightBits to 0 in
  # windowed mode -- the stop the picture is missing -- and (b) sends the curve
  # to the display ramp, while an AVI is read back from the framebuffer, which
  # never sees one. That leaves r_intensity, a flat multiply that clips at 255,
  # which is why turning it up washed out the sky before it fixed the shadows.
  #
  # A curve here does what was wanted instead: measured against the same frames,
  # mean luma 72 -> 97 while the high percentile moves 151 -> 173. Lifting the
  # dark end roughly twice as hard as the bright end is the whole point.
  #
  # One number, tune freely. 1.0 disables it.
  RENDER_GAMMA: "1.3"
  # Bytes of MJPEG per capture chunk, converted to a frame count below.
  #
  # Sized rather than timed, because the engine splits a capture itself the
  # moment it passes 2GB (CL_CheckFileSize in cl_avi.cpp) and that split is
  # neither free nor announced: it drops the frame it was writing and prints a
  # console warning that lands in the picture. A 30s chunk at 1440p60 is ~2.9GB
  # and tripped it every time. 1GB leaves room for a scene busier than the ones
  # measured without ever getting close.
  CHUNK_BYTES: "1000000000"

jobs:
  render:
    name: Render and stage
    runs-on: ubuntu-22.04
    steps:
      # Nothing below interpolates ${{ }} into a shell script. Inputs reach the
      # scripts through env only, and are referenced as "$VAR", because a title
      # or description is attacker-influenced text and ${{ }} substitutes it
      # into the command *before* the shell parses it -- which is a shell
      # injection with access to this job's secrets.
      - name: Report rendering
        env:
          SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsS -X POST "$SORACLE_URL/api/render/callback" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg j "$JOB_ID" --argjson r "$RUN_ID" \
                  '{job_id:$j, status:"rendering", github_run_id:$r}')" \
            -o /dev/null

      - uses: actions/checkout@v4
        with:
          repository: soradozere/jk2mv
          ref: ${{ env.ENGINE_REF }}
          submodules: true
          fetch-depth: 0
          path: jk2mv

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libgl1-mesa-dev libopenal-dev libjpeg-dev libpng-dev libminizip-dev \
            xvfb libgl1-mesa-dri ffmpeg

      - name: Build engine
        run: |
          cmake -S jk2mv -B jk2mv/build/actions \
            -DCMAKE_BUILD_TYPE=Release -DUseInternalLibs=OFF -DBuildPortableVersion=ON
          cmake --build jk2mv/build/actions -j"$(nproc)"

      - name: Resolve game root
        id: root
        run: echo "ROOT=$GITHUB_WORKSPACE/jk2mv/build/actions/out/Release" >> "$GITHUB_OUTPUT"

      - name: Restore game assets from cache
        id: assetcache
        uses: actions/cache@v4
        with:
          path: assets/base-min.tar
          key: jk2-assets-${{ env.ASSET_VERSION }}

      - name: Download game assets
        if: steps.assetcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets
          curl -fsSL -o assets/base-min.tar "$R2_PUBLIC/render-assets/$ASSET_VERSION/base-min.tar"

      - name: Restore community pk3s from cache
        id: extracache
        uses: actions/cache@v4
        with:
          path: assets/extras
          key: jk2-extras-${{ env.EXTRAS_VERSION }}

      # Runs whether or not the cache hit, and fetches only what is missing.
      #
      # The cache key is the version prefix, so adding a pk3 to an existing
      # prefix -- which is the cheap way to ship a 9KB fix without making every
      # client re-download 20MB -- would restore a stale directory and quietly
      # skip the new file. Checking per file costs one stat and cannot go stale.
      - name: Download community pk3s
        run: |
          mkdir -p assets/extras
          for P in $EXTRA_PK3S; do
            [ -s "assets/extras/$P" ] && continue
            echo "  fetching $P"
            curl -fsSL -o "assets/extras/$P" \
              "$R2_PUBLIC/render-assets/extras/$EXTRAS_VERSION/$P"
          done
          ls -la assets/extras

      - name: Stage assets and demo
        env:
          ROOT: ${{ steps.root.outputs.ROOT }}
          DEMO_KEY: ${{ inputs.demo_key }}
        run: |
          mkdir -p "$ROOT/base/demos"
          tar -xf assets/base-min.tar -C "$ROOT/base"
          # After base-min, so the names decide what wins -- see EXTRA_PK3S.
          cp assets/extras/*.pk3 "$ROOT/base/" 2>/dev/null || true
          ls -la "$ROOT/base"/*.pk3
          # Demos are publicly readable, so this needs no credentials. Only the
          # upload at the end does.
          curl -fsSL -o "$ROOT/base/demos/job.dm_15" "$R2_PUBLIC/demos/$DEMO_KEY"
          ls -la "$ROOT/base/demos/job.dm_15"

      - name: Write render config
        id: cfg
        env:
          ROOT: ${{ steps.root.outputs.ROOT }}
          START_MS: ${{ inputs.start_ms }}
          END_MS: ${{ inputs.end_ms }}
          FPS: ${{ inputs.fps }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
          FOV: ${{ inputs.fov }}
          CAM_MODE: ${{ inputs.cam_mode }}
          FOLLOW: ${{ inputs.follow_client_id }}
        run: |
          set -u
          FPS=${FPS:-60}

          # Camera, from cvars alone. Proven on a runner rather than assumed:
          # cg_demoFollow retargets the camera, cg_thirdPersonAngle swings it,
          # cg_demoCam switches to free. These are the same cvars the browser
          # viewer drives through its JKD_* exports, so the two entry points
          # cannot drift apart.
          case "$CAM_MODE" in
            free)   DEMOCAM=1; THIRD=0 ;;
            chase)  DEMOCAM=0; THIRD=1 ;;
            *)      DEMOCAM=0; THIRD=1 ;;
          esac
          FOLLOW_VAL="${FOLLOW:--1}"
          [ -z "$FOLLOW" ] && FOLLOW_VAL=-1

          # Frames per chunk, from the byte budget above.
          #
          # MJPEG at quality 95 measured 0.45 bytes per pixel per frame on real
          # gameplay -- 1.64MB at 1440p -- which is how a 30s chunk came to
          # overrun 2GB. Clamped either side: a chunk shorter than 4s makes
          # boundaries needlessly frequent, and one longer than 30s stops
          # bounding peak disk, which is the reason chunking exists.
          BYTES_PER_FRAME=$(( WIDTH * HEIGHT * 45 / 100 ))
          CHUNK_FRAMES=$(( CHUNK_BYTES / BYTES_PER_FRAME ))
          [ "$CHUNK_FRAMES" -lt $(( FPS * 4 )) ] && CHUNK_FRAMES=$(( FPS * 4 ))
          [ "$CHUNK_FRAMES" -gt $(( FPS * 30 )) ] && CHUNK_FRAMES=$(( FPS * 30 ))

          # The command buffer ticks twice per rendered frame, measured -- so a
          # chunk of N frames needs 2N waits.
          CHUNK_WAITS=$(( CHUNK_FRAMES * 2 ))

          # How many chunks to ask for.
          #
          # The segment, not the offset. Capture used to start at the demo's
          # beginning and cut the wanted part out afterwards, so thirty seconds
          # from an hour into a match cost an hour of rendering -- and at 1440p
          # the intermediate video for that hour is several times a runner's
          # disk, so it would have failed rather than merely wasted the time.
          # seekdemo below skips the lead-in by parsing it, which is roughly
          # three orders of magnitude faster than drawing it.
          SEGMENT_MS=$(( END_MS - START_MS ))
          TOTAL_FRAMES=$(( SEGMENT_MS * FPS / 1000 ))
          CHUNKS=$(( (TOTAL_FRAMES + CHUNK_FRAMES - 1) / CHUNK_FRAMES ))
          [ "$CHUNKS" -lt 1 ] && CHUNKS=1
          echo "fps=$FPS chunks=$CHUNKS x $CHUNK_FRAMES frames=$TOTAL_FRAMES cam=$CAM_MODE follow=$FOLLOW_VAL"
          echo "CHUNKS=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "CHUNK_FRAMES=$CHUNK_FRAMES" >> "$GITHUB_OUTPUT"

          CFG="$ROOT/base/render.cfg"
          {
            echo "set com_hunkMegs 256"
            echo "set r_mode -1"
            echo "set r_customwidth $WIDTH"
            echo "set r_customheight $HEIGHT"
            echo "set r_fullscreen 0"
            echo "set r_swapInterval 0"
            # Audio capture only works off the base DMA mixer; under OpenAL
            # cl_avi.cpp disables it and the render comes out silent.
            echo "set s_useOpenAL 0"
            # Below 1: the gate clipped at max_volume 0.0 dB.
            echo "set s_volume 0.8"
            echo "set cl_aviFrameRate $FPS"
            echo "set cl_aviMotionJpeg 1"
            # 95 rather than 90: this is the only original of the footage, and
            # everything downstream re-encodes it. Compression artefacts baked
            # in here cannot be recovered later.
            echo "set cl_aviMotionJpegQuality 95"
            # The HUD, as the game draws it: health, shield, force, score, and
            # the followed player's portrait and name. cg_draw2D 0 was hiding
            # all of it at once for a "clean" picture nobody asked for.
            echo "set cg_draw2D 1"

            # Kill feed. Obituaries reach the notify area through the console,
            # so cl_noprint must be 0 -- it returns early from Con_Print and
            # silently takes the feed with it.
            echo "set cl_noprint 0"
            echo "set con_notifytime 10"

            # Kills without the conversation. The notify area carries both and
            # con_notifytime cannot separate them, which is why cg_drawChat
            # exists in the fork's cgame -- it gates the chat print sites and
            # leaves obituaries alone.
            echo "set cg_drawChat 0"

            # Clutter that belongs on a live screen, not a published video.
            echo "set cg_drawFPS 0"
            echo "set cg_lagometer 0"
            # The web viewer pins this (FIXED_FOV in jkd-client.ts). Without it
            # the engine default of 80 applies and renders come out visibly
            # tighter than the same demo looks on the site.
            echo "set cg_fov $FOV"
            echo ""
            echo "demo job"
            # Deliberately tiny, and it must stay that way.
            #
            # wait counts FRAMES, and before capture starts the demo plays at
            # whatever speed the renderer manages -- ~38fps at 720p but ~17fps
            # at 1080p. A big wait therefore burns a different amount of demo
            # depending on the resolution and the runner, so the same request
            # produced 17.3s of footage at 720p30 and 14.1s at 1080p60. Which
            # part of the demo you get must not depend on how fast the machine
            # is; that is the whole point of rendering offline.
            #
            # Just enough for cgame to exist so the camera cvars land. If the
            # follow target has not appeared in a snapshot yet the camera falls
            # back for a moment and then locks on, which the ffmpeg cut below
            # removes anyway.
            echo "wait 20"
            echo "set cg_demoCam $DEMOCAM"
            echo "set cg_demoFollow $FOLLOW_VAL"
            echo "set cg_thirdPerson $THIRD"
            echo "set cg_thirdPersonRange 80"
            echo "set cg_thirdPersonAngle 0"
            echo "set cg_cameraOrbit 0"
            echo "wait 10"
            # Land on the requested moment, immediately before capture starts.
            #
            # Last, not first: the waits above run at whatever speed the machine
            # manages, so anything between the seek and the first frame would
            # drift the start by a machine-dependent amount -- the thing this
            # whole file exists to avoid. Seeking here means frame one is the
            # frame that was asked for.
            #
            # Forward only, so start_ms 0 is a no-op and the few frames the
            # waits above consume are still there. Nothing to do about that
            # short of not needing the waits.
            echo "seekdemo $START_MS"
            # Zero-padded so lexical order is chronological order -- part10
            # must not sort before part2, or chunks concat out of sequence.
            for i in $(seq 0 $(( CHUNKS - 1 ))); do
              printf 'video part%03d\n' "$i"
              echo "wait $CHUNK_WAITS"
              echo "stopvideo"
            done
            echo "quit"
          } > "$CFG"
          head -30 "$CFG"

      - name: Render
        timeout-minutes: 300
        env:
          ROOT: ${{ steps.root.outputs.ROOT }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_AUDIODRIVER: "dummy"
        run: |
          set -u
          VID="$ROOT/base/videos"
          mkdir -p "$VID" chunks

          # Every AVI the engine wrote, oldest first.
          #
          # Not just part*.avi. Once a capture passes 2GB the engine closes it
          # and carries on into the same name with an underscore appended --
          # part000.avi, then part000.avi_, then part000.avi__. That footage is
          # real and continuous, but the old glob did not match it, so nobody
          # transcoded it and it was dropped without a word: a published render
          # lost 8.2s out of the middle and only the seam gave it away.
          #
          # The index sidecar (.avi.index.dat) has to stay out of the list, so
          # match the two shapes explicitly rather than with part*.avi*.
          # LC_ALL=C so the ordering is byte order rather than the runner's
          # collation, which treats punctuation as noise.
          avis () { ls -1 "$VID"/part*.avi "$VID"/part*.avi_* 2>/dev/null | LC_ALL=C sort; }

          # Output name that keeps lexical order chronological.
          #
          # part000.avi_ cannot simply keep its name: "part000.avi_.mp4" sorts
          # before "part000.mp4", so the pieces would concatenate out of order.
          # Rebuild it from the stem and the number of trailing underscores.
          chunkname () {
            base=$(basename "$1")
            stem=${base%%.avi*}
            suffix=${base#*.avi}
            printf 'chunks/%s-%02d.mp4' "$stem" "${#suffix}"
          }

          # Transcode finished chunks while the engine is still writing.
          #
          # Waiting until the end would leave every AVI on disk at once, which
          # is the whole problem chunking exists to solve -- 62GB for a 2h
          # render at 60fps against a runner's ~14GB. This converts each chunk
          # to mp4 and deletes the AVI as soon as the engine has moved past it,
          # so peak disk stays at roughly one chunk.
          #
          # "Moved past it" means a newer AVI exists, hence the head -n -1
          # below: the newest file is the one still being written to.
          transcode () {
            avi="$1"
            out=$(chunkname "$avi")
            [ -f "$out" ] && return 0
            # crf 16, not 21: this intermediate is a ceiling on the finished
            # video's quality, so encoding it cheaply would throw away detail
            # that the final pass then cannot recover. Still roughly a tenth of
            # the MJPEG it replaces, which is what keeps disk flat.
            ffmpeg -nostdin -y -i "$avi" \
              -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 16 \
              -c:a aac -b:a 192k "$out" >/dev/null 2>&1 || return 1
            # The engine removes its own index sidecar on close; this only
            # catches one left behind by a capture that died mid-write.
            rm -f "$avi" "$avi".index.dat 2>/dev/null || true
            echo "  chunked $(basename "$out")"
          }

          watcher () {
            while [ ! -f .render-done ]; do
              # head -n -1: the newest file is the one still being written to.
              for avi in $(avis | head -n -1); do
                transcode "$avi" || true
              done
              sleep 3
            done
          }
          watcher &
          WATCHER=$!

          START=$(date +%s)
          # s_khz 44 has to be on the command line, not in the cfg: the sound
          # system reads it once at startup, long before render.cfg runs.
          #
          # It is here because 22050 is not divisible by 60, and the engine says
          # so -- once per AVI it opens, which with chunking means repeatedly,
          # mid-capture. cl_noprint has to stay 0 for the kill feed, so that
          # warning went to the notify area and burned into the published video
          # for ten seconds. 44100 divides by 60 exactly (735 samples a frame),
          # so it never prints, and the audio track improves on the way past.
          xvfb-run --auto-servernum --server-args="-screen 0 ${WIDTH}x${HEIGHT}x24" \
            "$ROOT/jk2mvmp" \
            +set fs_basepath "$ROOT" +set fs_homepath "$ROOT" \
            +set s_khz 44 \
            +set logfile 2 \
            +exec render.cfg 2>&1 | tail -40 || true
          echo "=== engine finished in $(( $(date +%s) - START ))s ==="

          touch .render-done
          wait "$WATCHER" 2>/dev/null || true

          # Whatever the watcher left, including the final chunk it was told
          # not to touch.
          for avi in $(avis); do
            transcode "$avi" || echo "  FAILED to transcode $avi"
          done

          # Anything the engine printed while capturing was also drawn on
          # screen, because the kill feed needs cl_noprint 0. Surfacing it here
          # is how a warning gets noticed in a log rather than in a video.
          LOG=$(find "$ROOT" -name qconsole.log 2>/dev/null | head -1)

          # A seek that stopped short renders the wrong part of the demo, and
          # every other check here would still pass: the frames are all present,
          # the chunks are all full length, the video is simply of somewhere
          # else. Only the engine knows, so ask it.
          if [ -n "$LOG" ] && grep -q "seekdemo: FAILED" "$LOG"; then
            grep -h "seekdemo:" "$LOG" | tail -2 >&2
            echo "the seek did not reach the requested moment -- refusing to stage the wrong footage" >&2
            exit 1
          fi
          grep -h "seekdemo:" "$LOG" 2>/dev/null | tail -1 || true

          echo "=== console warnings, which are also in the picture ==="
          if [ -n "$LOG" ]; then
            grep -ihE "WARNING|ERROR" "$LOG" \
              | grep -viE "mixed glWrapClampMode|R_FindImageFile|could not find" \
              | sort -u | head -10 || true
            grep -i "Freq:" "$LOG" | head -2 || true
          fi

          echo "=== chunks ==="
          ls -la chunks/ || true
          # RUNNER_DISK_BYTES in render-actions.ts is a conservative guess until
          # this says otherwise; the ladder refuses long renders based on it.
          df -h . | tail -1
          if [ -z "$(ls -A chunks 2>/dev/null)" ]; then
            echo "no chunks were produced -- the engine wrote nothing" >&2
            exit 1
          fi

      - name: Concatenate and cut the segment
        id: out
        env:
          START_MS: ${{ inputs.start_ms }}
          END_MS: ${{ inputs.end_ms }}
          FPS: ${{ inputs.fps }}
          CHUNK_FRAMES: ${{ steps.cfg.outputs.CHUNK_FRAMES }}
        run: |
          set -u
          : > concat.txt
          for f in $(ls -1 chunks/part*.mp4 | sort); do
            printf "file '%s'\n" "$PWD/$f" >> concat.txt
          done
          cat concat.txt

          # Did every chunk deliver the frames it was asked for?
          #
          # This is the check that was missing when a 2GB split threw away 491
          # frames: the run succeeded, the video was short, and nothing said so
          # until someone watched it. A chunk arrives in one or more pieces
          # (partNNN-00, partNNN-01 ...), so count by stem. Only the last chunk
          # may be short, and only because the demo ran out.
          count () { ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames -of csv=p=0 "$1"; }
          echo "=== frames per chunk (expect $CHUNK_FRAMES, last may be short) ==="
          LAST=$(ls -1 chunks/part*.mp4 | sed 's/-[0-9]*\.mp4$//' | sort -u | tail -1)
          SHORT=0
          for stem in $(ls -1 chunks/part*.mp4 | sed 's/-[0-9]*\.mp4$//' | sort -u); do
            N=0
            for f in "$stem"-*.mp4; do C=$(count "$f"); N=$(( N + ${C:-0} )); done
            FLAG=""
            if [ "$N" -lt "$CHUNK_FRAMES" ] && [ "$stem" != "$LAST" ]; then
              FLAG="  <-- SHORT, footage was lost"
              SHORT=1
            fi
            echo "  $(basename "$stem"): $N frames$FLAG"
          done
          if [ "$SHORT" = 1 ]; then
            echo "::warning::A chunk came up short -- the render is missing footage"
          fi

          # Stream copy: every chunk was encoded with identical settings, so
          # there is nothing to re-encode and nothing to lose.
          ffmpeg -nostdin -y -f concat -safe 0 -i concat.txt -c copy joined.mp4 2>&1 | tail -3

          # Only the tail needs trimming now. seekdemo put frame one on the
          # requested moment, so there is no lead-in to cut off; what is left
          # over is the rounding from asking for whole chunks -- up to one
          # chunk's worth past the end.
          DUR=$(awk -v v="$(( END_MS - START_MS ))" 'BEGIN{printf "%.3f", v/1000}')
          # Re-encode rather than copy: a stream copy can only cut on a
          # keyframe, which would drift the segment by up to a couple of
          # seconds from what the requester actually chose.
          # crf 20 with a 192k audio track. YouTube re-encodes anything it is
          # given and recommends ~12 Mbps for 1080p60, so this sits comfortably
          # above their target without the ~35 Mbps that crf 18 produced -- a
          # bitrate that buys nothing visible downstream and would make a long
          # match unwieldy to store and upload.
          #
          # Brightness rides along with this pass rather than getting one of its
          # own: the grade is a filter, the encode was happening anyway, and a
          # separate pass would mean encoding the whole thing twice.
          GRADE=""
          if [ "$RENDER_GAMMA" != "1.0" ]; then
            GRADE="-vf eq=gamma=$RENDER_GAMMA"
          fi
          echo "grading with: ${GRADE:-none}"
          # shellcheck disable=SC2086
          ffmpeg -nostdin -y -i joined.mp4 -t "$DUR" $GRADE \
            -c:v libx264 -pix_fmt yuv420p -preset medium -crf 20 \
            -c:a aac -b:a 192k -movflags +faststart render.mp4 2>&1 | tail -3

          ls -la render.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 render.mp4
          echo "=== audio should not be silent ==="
          ffmpeg -nostdin -i render.mp4 -af volumedetect -f null /dev/null 2>&1 | grep mean_volume || true

      - name: Upload to R2
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RENDERS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RENDERS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -u
          KEY="$JOB_ID.mp4"
          # --content-type explicitly: without it the object can land as
          # application/octet-stream, and the review player will not touch a
          # video whose type it cannot recognise.
          aws s3 cp render.mp4 "s3://$RENDER_BUCKET/$KEY" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type video/mp4 \
            --no-progress
          echo "KEY=$KEY" >> "$GITHUB_OUTPUT"

      - name: Report ready for review
        env:
          SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
          KEY: ${{ steps.upload.outputs.KEY }}
        run: |
          curl -fsS -X POST "$SORACLE_URL/api/render/callback" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg j "$JOB_ID" --arg k "$KEY" \
                  '{job_id:$j, status:"pending_review", render_r2_key:$k}')" \
            -o /dev/null

      # Catches every failure above, including the timeout and a cancelled run.
      # Without this the row sits at 'rendering' indefinitely and the only way
      # to find out is to go looking in Actions.
      - name: Report failure
        if: failure() || cancelled()
        env:
          SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "$SORACLE_URL/api/render/callback" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg j "$JOB_ID" --arg e "The render job failed or was cancelled. Logs: $RUN_URL" \
                  '{job_id:$j, status:"failed", error:$e}')" \
            -o /dev/null || true
